name: Deploy Zola Site

on:
  push:
    branches: [master]
    paths-ignore:
      - "content/changelog.md"
      - ".github/workflows/changelog.yml"
  workflow_dispatch:
    inputs:
      skip_changelog:
        description: "Skip changelog generation"
        type: boolean
        default: false
      skip_d2:
        description: "Skip D2 diagram build"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.23.4"
  D2_VERSION: "0.6.9"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Zola
        id: cache-zola
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/zola
          key: zola-${{ env.ZOLA_VERSION }}-${{ runner.os }}

      - name: Cache D2
        id: cache-d2
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/d2
          key: d2-${{ env.D2_VERSION }}-${{ runner.os }}

      - name: Install Zola
        if: steps.cache-zola.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ env.ZOLA_VERSION }}

      - name: Install D2
        if: steps.cache-d2.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL https://d2lang.com/install.sh \
            | sh -s -- --version "v${D2_VERSION}"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify tools
        run: |
          echo "zola:   $(zola --version)"
          echo "d2:     $(d2 --version)"
          echo "python: $(python3 --version)"

      - name: Generate changelog
        if: ${{ !inputs.skip_changelog }}
        run: |
          if [[ -x scripts/gen_changelog.py ]]; then
            python3 scripts/gen_changelog.py --limit 1000
          elif [[ -x scripts/gen-changelog.sh ]]; then
            ./scripts/gen-changelog.sh --limit 1000
          else
            echo "· no changelog script found, skipping"
          fi

      - name: Build D2 diagrams
        if: ${{ !inputs.skip_d2 }}
        run: |
          if [[ ! -d d2-src ]]; then
            echo "· d2-src/ not found, skipping"
            exit 0
          fi
          if [[ ! -f scripts/d2.py ]]; then
            echo "::error::scripts/d2.py not found — required for D2 build"
            exit 1
          fi
          python3 scripts/d2.py build --prune --jobs 4

      - name: Verify D2 refs
        if: ${{ !inputs.skip_d2 }}
        run: python3 scripts/d2.py check

      - name: List D2 output
        run: |
          echo "## D2 SVGs" >> $GITHUB_STEP_SUMMARY
          if [[ -d static/d2 ]]; then
            count=$(find static/d2 -name '*.svg' -type f | wc -l)
            echo "Generated: **$count** SVG(s)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            find static/d2 -name '*.svg' -type f | sort | head -30 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No static/d2/ directory" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Validate config
        run: |
          test -f zola.toml || { echo "::error::zola.toml missing"; exit 1; }
          echo "✓ zola.toml present"

      - name: Check Zola config
        run: zola check --skip-external-links 2>&1 || true

      - name: Build site
        run: zola build

      - name: Verify build output
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing"; exit 1; }

          # D2 output count — safe if dir missing
          if [[ -d public/d2 ]]; then
            d2_count=$(find public/d2 -name '*.svg' -type f | wc -l)
          else
            d2_count=0
          fi

          echo "## Build output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Size: **$(du -sh public | cut -f1)**" >> $GITHUB_STEP_SUMMARY
          echo "- HTML pages: **$(find public -name '*.html' -type f | wc -l)**" >> $GITHUB_STEP_SUMMARY
          echo "- D2 SVGs: **$d2_count**" >> $GITHUB_STEP_SUMMARY
          echo "- Total files: **$(find public -type f | wc -l)**" >> $GITHUB_STEP_SUMMARY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          retention-days: 7

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "## Deployment successful :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Ref:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
