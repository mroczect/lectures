{% extends "index.html" %} {% block title %}Search — {{ config.title }}{%
endblock title %} {% block main_content %}
<main>
  <h1>Search</h1>
  <input type="search" id="search-input" placeholder="Search..." autofocus />
  <ul id="search-results"></ul>

  <script src="{{ get_url(path='elasticlunr.min.js') }}"></script>
  <script src="{{ get_url(path='search_index.' ~ lang ~ '.js') }}"></script>
  <script>
    (function () {
      var idx = elasticlunr.Index.load(window.searchIndex);
      var input = document.getElementById("search-input");
      var results = document.getElementById("search-results");

      input.addEventListener("input", function () {
        var q = input.value.trim();
        results.innerHTML = "";
        if (!q) return;

        var hits = idx.search(q).slice(0, 20);

        if (hits.length === 0) {
          var li = document.createElement("li");
          li.textContent = "No results.";
          results.appendChild(li);
          return;
        }

        hits.forEach(function (hit) {
          var doc = idx.documentStore.getDoc(hit.ref);
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = doc.url || hit.ref;
          a.textContent = doc.title || hit.ref;
          li.appendChild(a);
          results.appendChild(li);
        });
      });
    })();
  </script>
</main>
{% endblock main_content %}
