[project]
name = "lectures"
version = "0.1.0"
description = "Dokumentasi kuliah Program Studi Teknologi Rekayasa Perangkat Lunak - Politeknik Negeri Batam"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "mroczect", email = "mroczect@proton.me" }
]
license = { text = "CC0-1.0" }
keywords = ["sphinx", "documentation", "lectures", "trpl", "polibatam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Framework :: Sphinx :: Theme",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
]

dependencies = [
    "sphinx>=8.0",
    "sphinx-book-theme>=1.1",
    "sphinxcontrib-mermaid>=1.0",
]

[project.optional-dependencies]
dev = [
    "sphinx-autobuild>=2024.10.3",
]

[project.urls]
Homepage = "https://github.com/mroczect/lectures"
Repository = "https://github.com/mroczect/lectures"
Documentation = "https://mroczect.github.io/lectures/"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "py.typed"]